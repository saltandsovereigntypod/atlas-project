name: Apply Atlas UI sweep

on:
  push:
    paths:
      - 'scripts/apply-atlas-ui-sweep.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/apply-atlas-ui-sweep.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Refresh page building, documents, and database canvas cards"
            git push
          fi
